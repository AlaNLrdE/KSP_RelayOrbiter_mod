<text x="400.3" y="425.0" font-size="12" text-anchor="middle" fill="#5B6B7C" font-weight="normal">2 · a_e  (a_e ≈ 0.763 · r_c)</text>
<line x1="600" y1="70" x2="628" y2="70" stroke="#3B6EA8" stroke-width="2"/>
