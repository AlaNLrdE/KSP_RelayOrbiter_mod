<text x="174.0" y="243.0" font-size="12" text-anchor="end" fill="#5B6B7C" font-weight="normal">r_peri ≈ 0.526 · r_c</text>
<line x1="270.5" y1="431" x2="530.0" y2="431" stroke="#5B6B7C" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
