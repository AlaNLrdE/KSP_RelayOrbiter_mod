    <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B6EA8"/>
  </marker>
</defs>
<text x="380.0" y="28.0" font-size="15" text-anchor="middle" fill="#1F2A37" font-weight="bold">Parking orbit geometry (to scale)</text>
