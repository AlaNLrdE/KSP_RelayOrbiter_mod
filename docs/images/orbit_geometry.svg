<text x="636.0" y="118.0" font-size="12" text-anchor="start" fill="#1F2A37" font-weight="normal">Carrier parking orbit</text>
<text x="636.0" y="134.0" font-size="11" text-anchor="start" fill="#5B6B7C" font-weight="normal">period T_e = ⅔ · T_c</text>
<circle cx="614" cy="158" r="8" fill="#D6E6F5"/>
<circle cx="614" cy="158" r="5" fill="#7FA7D1"/>
