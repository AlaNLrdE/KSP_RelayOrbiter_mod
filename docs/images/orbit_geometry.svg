<polygon points="530.0,226.0 539.0,235.0 530.0,244.0 521.0,235.0" fill="#D9822B" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="546.0" y="215.0" font-size="13" text-anchor="start" fill="#1F2A37" font-weight="bold">Apoapsis = r_c</text>
<text x="546.0" y="231.0" font-size="12" text-anchor="start" fill="#5B6B7C" font-weight="normal">release point</text>
<text x="546.0" y="247.0" font-size="12" text-anchor="start" fill="#5B6B7C" font-weight="normal">satellites circularize here</text>
<circle cx="270.5" cy="235" r="5" fill="#D9822B"/>
