<text x="380.0" y="458.0" font-size="11" text-anchor="middle" fill="#5B6B7C" font-weight="normal">Drawn to scale for Kerbin (R = 600 km, atmosphere 70 km) with a 1000 km target — periapsis 242 km clears the atmosphere</text>
</svg>
